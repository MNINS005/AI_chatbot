<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Support Chatbot</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      .header {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
      }
      .chat-container {
        background: white;
        border-radius: 8px;
        height: 400px;
        display: flex;
        flex-direction: column;
      }
      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }
      .message {
        margin-bottom: 15px;
      }
      .message.user {
        text-align: right;
      }
      .message-bubble {
        display: inline-block;
        padding: 10px;
        border-radius: 10px;
        background: #f1f1f1;
        max-width: 70%;
      }
      .message.user .message-bubble {
        background: #007bff;
        color: white;
      }
      .input-area {
        padding: 15px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 10px;
      }
      .message-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 20px;
      }
      .btn {
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .send-btn {
        background: #007bff;
        color: white;
      }
      .clear-btn {
        background: #dc3545;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 Customer Support</h1>
      </div>

      <div class="chat-container">
        <div id="chatMessages" class="messages">
          <div class="message bot">
            <div class="message-bubble">Hello! I'm here to help you.</div>
          </div>
        </div>

        <div class="input-area">
          <input
            type="text"
            id="messageInput"
            placeholder="Type your message..."
            class="message-input"
            onkeypress="handleKeyPress(event)"
          />
          <button
            onclick="clearChat()"
            class="btn clear-btn"
            title="Clear Chat"
          >
            🗑️
          </button>
          <button onclick="sendMessage()" class="btn send-btn">➤</button>
        </div>
      </div>
    </div>

    <script>
      const sessionId = "session_" + Date.now();

      function handleKeyPress(e) {
        if (e.key === "Enter") sendMessage();
      }

      function sendMessage() {
        const input = document.getElementById("messageInput");
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";

        fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, session_id: sessionId }),
        })
          .then((res) => res.json())
          .then((data) =>
            addMessage(
              data.error
                ? "Sorry, I encountered an error. Please try again."
                : data.response,
              "bot",
            ),
          )
          .catch(() =>
            addMessage(
              "Sorry, I'm having trouble connecting. Please try again.",
              "bot",
            ),
          );
      }

      function addMessage(message, sender) {
        const messagesContainer = document.getElementById("chatMessages");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}`;
        messageDiv.innerHTML = `<div class="message-bubble">${message}</div>`;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function clearChat() {
        if (confirm("Clear chat history?")) {
          document.getElementById("chatMessages").innerHTML =
            '<div class="message bot"><div class="message-bubble">Hello! I\'m here to help you.</div></div>';
        }
      }

      document.getElementById("messageInput").focus();
    </script>
  </body>
</html>
